<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLI Interview Booking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='6' fill='%2329b6ee'/%3E%3Crect x='2' y='4' width='7' height='24' fill='%2329b6ee'/%3E%3Crect x='12' y='13' width='7' height='15' fill='%236cc08b'/%3E%3Crect x='22' y='13' width='7' height='15' fill='%233dbab0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column — greeting, details form, a week-by-week slot grid, then a send panel */
:root{
  --bg:#f4f9fc; --surface:#ffffff; --ink:#1b2c4f; --muted:#56657d; --line:#d6e2ec;
  --accent:#2f5597; --accent-ink:#ffffff; --accent-soft:#e2eefa; --pick:#6cc08b; --pick-ink:#0f2a1b; --warn:#b3261e;
  --sky:#29b6ee; --teal:#3dbab0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1726; --surface:#16233a; --ink:#e8eef6; --muted:#9fb0c6; --line:#27384f;
  --accent:#6fb2ff; --accent-ink:#0e1726; --accent-soft:#1b2f4d; --pick:#6cc08b; --pick-ink:#0f2a1b; --warn:#ff8a80;
  --sky:#4cc4f2; --teal:#4fc9be; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1726; --surface:#16233a; --ink:#e8eef6; --muted:#9fb0c6; --line:#27384f;
  --accent:#6fb2ff; --accent-ink:#0e1726; --accent-soft:#1b2f4d; --pick:#6cc08b; --pick-ink:#0f2a1b; --warn:#ff8a80;
  --sky:#4cc4f2; --teal:#4fc9be; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
#form{display:contents}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:inline-flex;background:#ffffff;border-radius:10px;padding:8px 12px}
.logo img{display:block;height:52px;width:auto}
.about{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.about p{margin:0;max-width:64ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{min-width:0;padding-left:12px;border-left:3px solid var(--sky)}
.fact:nth-child(2){border-color:var(--pick)}.fact:nth-child(3){border-color:var(--teal)}.fact:nth-child(4){border-color:var(--accent)}
.fact b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted);line-height:1.35;display:block}
@media (max-width:620px){.facts{grid-template-columns:1fr 1fr;row-gap:16px}}
.site{align-self:flex-start;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.lead{margin:12px 0 0;max-width:62ch;color:var(--muted)}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 4px}
.hint{margin:0 0 14px;color:var(--muted);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;min-width:0}
label .opt{font-weight:400;color:var(--muted)}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.full{grid-column:1/-1}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.week{margin-top:18px}
.week-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dow{font-family:var(--display);font-weight:700;font-size:17px}
.date{color:var(--muted);font-size:13px;white-space:nowrap}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{font:700 14px var(--body);font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 4px;cursor:pointer;transition:background .12s,border-color .12s}
.slot:hover{border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}
.daytoggle{font:13px var(--body);color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.tz{font-size:13px;color:var(--muted);margin-top:10px}
.count{font-weight:700}
.primary{font:700 16px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:13px 22px;cursor:pointer}
.secondary{font:700 15px var(--body);background:var(--surface);color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--warn);font-size:14px;margin:0}
.send{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.to{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--accent-soft);padding:4px 10px;border-radius:6px;user-select:all;word-break:break-all}
pre.msg{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:340px;overflow:auto;user-select:all}
.ok{color:var(--muted);font-size:14px}
@media (max-width:620px){.days{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.slot:disabled{cursor:not-allowed;background:transparent;color:var(--muted);text-decoration:line-through;opacity:.55}
.slot:disabled:hover{border-color:var(--line)}
.status{font-size:14px;color:var(--muted);margin:0}
.picked{font-weight:700}
.done{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pick);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.done h2{margin:0}
.done p{margin:0}
.done .when{font-family:var(--display);font-size:20px;font-weight:700}
.primary:disabled{opacity:.6;cursor:progress}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;font-size:14px;padding:0;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{width:auto;margin:0;accent-color:var(--accent)}
#otherWrap{margin-top:10px}
.months{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.month{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:700 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-width:0}
.month small{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.month[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.month[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
.closed{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
</style>
</head>

<script>

const TZ = "America/Toronto";
const DAYS_OPEN = [3,4,5];                     // Wed, Thu, Fri
const TIMES = ["09:30","10:00","10:30","11:00","11:30","12:00"];
const MONTHS_AHEAD = 3;                        // this month + next 2
/* ==================== */

const T = {

    aboutH:"About MLI",about:"Founded in Montréal in 2009, MLI has specialized in French language education for over 17 years. Our teaching team includes instructors with master’s and doctoral degrees and certified TEF, TCF and DELF/DALF examiners. Together we have helped tens of thousands of students reach their language test goals and move forward in Canada.",

    youH:"Your details",name:"Full name",email:"Email",phone:"Phone",optional:"(optional)",note:"Anything we should know",statusQ:"Your status in Canada",sWP:"Work permit",sSP:"Study permit",sPR:"Permanent resident",sCI:"Canadian citizen",sOT:"Other",sOTlabel:"Please explain",errStatus:"Please select your status in Canada.",errOther:"Please explain your status.",

    weekOf:"Week of",openCount:n=>n+(n===1?" time open":" times open"),tz:"All times are Eastern Time (Toronto / Montréal).",noSlots:"No times left this day",
    submit:"Book this interview",sending:"Booking…",chosen:"Selected: ",
    errName:"Please enter your full name.",errEmail:"Please enter a valid email address.",errSlot:"Please choose a time.",
    errTaken:"Sorry, someone just booked that time. Please choose another one.",errSend:"Your booking could not be sent. Please check your connection and try again.",
    doneH:"Thank you, your interview is booked",doneBody:"We have received your booking and will contact you by email with the interview details. A confirmation has also been sent to your email address.",
    locale:"en-CA"},
  fr:{title:"Invitation à une entrevue",
    lead:"Merci pour votre candidature. Votre parcours nous intéresse et nous aimerions vous rencontrer en entrevue. Veuillez choisir une plage horaire ci-dessous et l’envoyer. Nous recevrons votre réservation immédiatement.",
    aboutH:"À propos de MLI",about:"Fondé à Montréal en 2009, l’Institut de langues de Montréal se spécialise dans l’enseignement du français depuis plus de 17 ans. Notre équipe compte des enseignants titulaires de maîtrises et de doctorats ainsi que des examinateurs certifiés TEF, TCF et DELF/DALF. Nous avons accompagné des dizaines de milliers d’apprenants vers la réussite de leurs examens et de leur parcours au Canada.",
    f1:"Fondé à Montréal",f2:"Campus : Montréal, Toronto, Vancouver",f3:"Accrédité par Langues Canada depuis",f4:"Centre d’examen officiel à Toronto",site:"Visitez notre site :",
    youH:"Vos coordonnées",name:"Nom complet",email:"Courriel",phone:"Téléphone",optional:"(facultatif)",note:"Informations utiles",statusQ:"Votre statut au Canada",sWP:"Permis de travail",sSP:"Permis d’études",sPR:"Résident permanent",sCI:"Citoyen canadien",sOT:"Autre",sOTlabel:"Veuillez préciser",errStatus:"Veuillez indiquer votre statut au Canada.",errOther:"Veuillez préciser votre statut.",
    slotsH:"Choisissez une plage horaire",slotsHint:"Les entrevues ont lieu du mercredi au vendredi en matinée et durent 30 minutes. Choisissez un mois, puis une plage horaire. Les plages barrées sont déjà réservées.",
    loading:"Chargement des plages disponibles…",loadFail:"Impossible de charger les plages disponibles. Veuillez actualiser la page.",
    weekOf:"Semaine du",openCount:n=>n+(n===1?" plage libre":" plages libres"),tz:"Toutes les heures sont à l’heure de l’Est (Toronto / Montréal).",noSlots:"Plus de plages ce jour-là",

    locale:"fr-CA"}
};

let lang = (navigator.language||"en").toLowerCase().startsWith("fr") ? "fr" : "en";
try{ const s=localStorage.getItem("mli-lang"); if(s==="en"||s==="fr") lang=s; }catch(e){}
let picked = null;            // "YYYY-MM-DD|HH:MM"
let booked = new Set();
let closed = new Set();
let loaded = false;

function torontoNow(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const g=t=>+p.find(x=>x.type===t).value;
  return new Date(Date.UTC(g("year"),g("month")-1,g("day"),12));
}
function iso(d){return d.toISOString().slice(0,10)}
function buildMonths(){
  const start=torontoNow(); start.setUTCDate(start.getUTCDate()+1);
  const end=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+MONTHS_AHEAD,1,12));
  const months=new Map();
  for(const d=new Date(start); d<end; d.setUTCDate(d.getUTCDate()+1)){
    if(!DAYS_OPEN.includes(d.getUTCDay())) continue;
    const mk=iso(d).slice(0,7);
    if(!months.has(mk)) months.set(mk,{first:new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1,12)),weeks:new Map()});
    const wk=new Date(d); wk.setUTCDate(wk.getUTCDate()-((wk.getUTCDay()+6)%7));
    const W=months.get(mk).weeks, k=iso(wk);
    if(!W.has(k)) W.set(k,{mon:wk,days:[]}); W.get(k).days.push(new Date(d));
  }
  return [...months.entries()].map(([key,v])=>({key,first:v.first,weeks:[...v.weeks.values()]}));
}
const MONTHS=buildMonths();
let curMonth=MONTHS.length?MONTHS[0].key:null;

function fmt(d,o){return new Intl.DateTimeFormat(T[lang].locale,{timeZone:"UTC",...o}).format(d)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function tl(t){const [h,m]=t.split(":").map(Number); return lang==="fr"? h+" h "+String(m).padStart(2,"0") : (h>12?h-12:h)+":"+String(m).padStart(2,"0")+(h>=12?" PM":" AM");}
function plus30(t){const [h,m]=t.split(":").map(Number); const e=h*60+m+30; return String(Math.floor(e/60)).padStart(2,"0")+":"+String(e%60).padStart(2,"0");}
function slotLabel(k){const [d,t]=k.split("|"); return cap(fmt(new Date(d+"T12:00:00Z"),{weekday:"long",month:"long",day:"numeric"}))+", "+tl(t)+" – "+tl(plus30(t));}

function render(){
  const box=document.getElementById("weeks"); box.innerHTML="";
  document.getElementById("loading").hidden=loaded;
  if(!loaded) return;
  const tabs=document.createElement("div"); tabs.className="months"; tabs.setAttribute("role","tablist");
  MONTHS.forEach(M=>{
    const b=document.createElement("button"); b.type="button"; b.className="month"; b.id="m-"+M.key;
    b.setAttribute("role","tab"); b.setAttribute("aria-selected",M.key===curMonth);
    const cnt=M.weeks.reduce((n,w)=>n+w.days.filter(d=>!closed.has(iso(d))).reduce((a,d)=>a+TIMES.filter(t=>!booked.has(iso(d)+"|"+t)).length,0),0);
    b.innerHTML=""; const n=document.createElement("span"); n.textContent=cap(fmt(M.first,{month:"long",year:"numeric"}));
    const c=document.createElement("small"); c.textContent=T[lang].openCount(cnt); b.append(n,c);
    b.onclick=()=>{curMonth=M.key; render();};
    tabs.append(b);
  });
  box.append(tabs);
  const M=MONTHS.find(x=>x.key===curMonth); if(!M) return;
  M.weeks.forEach(w0=>{
    const w={mon:w0.mon,days:w0.days.filter(d=>!closed.has(iso(d)))};
    if(!w.days.length) return;
    const sec=document.createElement("div"); sec.className="week";
    const lb=document.createElement("div"); lb.className="week-label"; lb.textContent=T[lang].weekOf+" "+fmt(w.mon,{month:"long",day:"numeric"});
    const grid=document.createElement("div"); grid.className="days";
    w.days.forEach(d=>{
      const key=iso(d);
      const card=document.createElement("div"); card.className="day";
      const head=document.createElement("div"); head.className="day-head";
      const dow=document.createElement("span"); dow.className="dow"; dow.textContent=cap(fmt(d,{weekday:"long"}));
      const dt=document.createElement("span"); dt.className="date"; dt.textContent=fmt(d,{month:"short",day:"numeric"});
      head.append(dow,dt); card.append(head);
      const slots=document.createElement("div"); slots.className="slots";
      let free=0;
      TIMES.forEach(t=>{
        const k=key+"|"+t;
        const b=document.createElement("button"); b.type="button"; b.className="slot"; b.id="s-"+key+"-"+t.replace(":","");
        b.textContent=tl(t);
        const taken=booked.has(k); b.disabled=taken; if(!taken) free++;
        b.setAttribute("aria-pressed",picked===k);
        b.setAttribute("aria-label",slotLabel(k));
        b.onclick=()=>{picked=k; document.getElementById("err").hidden=true; render();};
        slots.append(b);
      });
      if(free) card.append(slots); else {const c=document.createElement("div"); c.className="closed"; c.textContent=T[lang].noSlots; card.append(c);}
      grid.append(card);
    });
    sec.append(lb,grid); box.append(sec);
  });
  document.getElementById("pickedLabel").textContent=picked?T[lang].chosen+slotLabel(picked):"";
}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  if(picked && !document.getElementById("done").hidden) document.getElementById("doneWhen").textContent=slotLabel(picked);
  render();
}

function showErr(m){const e=document.getElementById("err"); e.textContent=m; e.hidden=false;}

async function loadBooked(){
  try{
    const r=await fetch(ENDPOINT+"?action=list&t="+Date.now());
    const j=await r.json();
    booked=new Set(j.booked||[]);
    closed=new Set(j.closed||[]);
    if(picked && booked.has(picked)) picked=null;
    loaded=true; render();
  }catch(e){
    const l=document.getElementById("loading"); l.textContent=T[lang].loadFail; l.hidden=false;
  }
}

document.getElementById("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const name=document.getElementById("f-name").value.trim();
  const email=document.getElementById("f-email").value.trim();
  const phone=document.getElementById("f-phone").value.trim();
  const note=document.getElementById("f-note").value.trim();
  const ws=document.querySelector('input[name="wstatus"]:checked');
  const other=document.getElementById("f-other").value.trim();
  const SLABEL={wp:"Work permit / Permis de travail",sp:"Study permit / Permis d’études",pr:"Permanent resident / Résident permanent",ci:"Canadian citizen / Citoyen canadien",ot:"Other / Autre"};
  if(!name) return showErr(T[lang].errName);
  if(!/^\S+@\S+\.\S+$/.test(email)) return showErr(T[lang].errEmail);
  if(!ws) return showErr(T[lang].errStatus);
  if(ws.value==="ot" && !other) return showErr(T[lang].errOther);
  if(!picked) return showErr(T[lang].errSlot);
  const wstatus=SLABEL[ws.value]+(ws.value==="ot"?": "+other:"");
  document.getElementById("err").hidden=true;
  const btn=document.getElementById("go"); btn.disabled=true; btn.textContent=T[lang].sending;
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({slot:picked,label:slotLabel(picked),name,email,phone,wstatus,note,lang})});
    const j=await r.json();
    if(j.ok){
      document.getElementById("form").hidden=true;
      document.getElementById("doneWhen").textContent=slotLabel(picked);
      const d=document.getElementById("done"); d.hidden=false; d.scrollIntoView({block:"start"});
    }else if(j.error==="taken"){
      showErr(T[lang].errTaken); picked=null; await loadBooked();
    }else showErr(T[lang].errSend);
  }catch(e){ showErr(T[lang].errSend); }
  btn.disabled=false; btn.textContent=T[lang].submit;
});

document.querySelectorAll('input[name="wstatus"]').forEach(r=>r.addEventListener("change",()=>{const o=document.getElementById("ws-ot").checked; document.getElementById("otherWrap").hidden=!o; if(o) document.getElementById("f-other").focus();}));
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang; try{localStorage.setItem("mli-lang",lang)}catch(e){} applyLang();});
applyLang();
loadBooked();
</script>
</body>
</html>
